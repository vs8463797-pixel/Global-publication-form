<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Portal - GLOBAL BOOK PUBLICATIONS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Blue and Pink gradient background */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #ff758c 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            background: #ffffff;
            margin: 40px auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border-top: 8px solid #ff1493; /* Deep Pink */
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ff758c;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }

        /* Fade-in & Fade-out Animation for Company Name */
        @keyframes textFadeGlow {
            0% {
                opacity: 0.7;
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 20, 147, 0.5);
            }
            100% {
                opacity: 0.7;
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
            }
        }

        .company-name {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, #1e3c72, #ff1493, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: textFadeGlow 3s infinite ease-in-out;
        }

        .portal-title {
            font-size: 17px;
            color: #1e3c72;
            font-weight: 600;
        }

        .exclusive-badge {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            color: #856404;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid #ffb300;
            box-shadow: 0 4px 10px rgba(255, 179, 0, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2a5298;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            background-color: #fafbfc;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ff1493;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 20, 147, 0.25);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        .radio-group {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #d1ecf1;
        }

        .radio-option {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .radio-option input {
            margin-right: 12px;
            accent-color: #ff1493;
            transform: scale(1.3);
        }

        .radio-option label {
            margin-bottom: 0;
            font-weight: 500;
            color: #333;
            cursor: pointer;
        }

        /* Pop-up / Blinking Submit Button Animation */
        @keyframes popPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 20, 147, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 15px rgba(255, 20, 147, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 20, 147, 0);
            }
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff1493 0%, #ff758c 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 15px;
            animation: popPulse 1.5s infinite;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .note {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Logo implementation (logo.jpg must be in the same folder) -->
        <div class="logo-container">
            <img src="logo.jpg" alt="Company Logo" onerror="this.style.display='none'">
        </div>
        <!-- Bold Colorful Company Name with Fade-in/Fade-out effect -->
        <div class="company-name">GLOBAL BOOK PUBLICATIONS</div>
        <div class="portal-title">Official Applicant Registration Portal</div>
    </div>

    <!-- Exclusive Notification -->
    <div class="exclusive-badge">
        ✨ Yeh application portal sirf aur sirf **Mahilaon / Girls** ke liye aayojit hai. ✨
    </div>

    <!-- Formspree Action Link -->
    <form action="https://formspree.io/f/moejeeaz" method="POST" enctype="multipart/form-data">
        
        <!-- Personal Details -->
        <div class="form-group">
            <label for="fullname">Full Name (पूरा नाम):</label>
            <input type="text" id="fullname" name="Full_Name" required placeholder="Apna pura naam likhein">
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="email">Email Address (ईमेल):</label>
                    <input type="email" id="email" name="Email" required placeholder="example@email.com">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="whatsapp">WhatsApp Number (व्हाट्सएप नंबर):</label>
                    <input type="tel" id="whatsapp" name="WhatsApp_Number" required placeholder="10-digit WhatsApp number">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="qualification">Educational Qualification (योग्यता):</label>
            <input type="text" id="qualification" name="Qualification" required placeholder="Jaise: Graduation, Post Graduation, 12th">
        </div>

        <!-- Address Details -->
        <div class="form-group">
            <label for="address">Full Address (पूरा पता):</label>
            <textarea id="address" name="Full_Address" required placeholder="House No, Street, Landmark etc."></textarea>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="state">State (राज्य चुनें):</label>
                    <select id="state" name="State" required>
                        <option value="">-- State Chunein --</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Puducherry">Puducherry</option>
                    </select>
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="district">District (जिला):</label>
                    <input type="text" id="district" name="District" required placeholder="Apna district likhein">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="pincode">Pincode (पिनकोड):</label>
            <input type="text" id="pincode" name="Pincode" required placeholder="6-digit pincode" maxlength="6">
        </div>

        <!-- Aadhaar Details -->
        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="aadhaar_no">Aadhaar Number (अनिवार्य):</label>
                    <input type="text" id="aadhaar_no" name="Aadhaar_Number" required placeholder="12-digit Aadhaar number" maxlength="12">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="aadhaar_proof">Aadhaar Card Upload (वैकल्पिक / Optional):</label>
                    <input type="file" id="aadhaar_proof" name="Aadhaar_Document" accept="image/*,.pdf">
                </div>
            </div>
        </div>

        <!-- Project Selection -->
        <div class="form-group">
            <label>Select Project (3 mein se koi 1 chunen):</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="project1" name="Selected_Project" value="Project 1: E-Book Content Editing & Proofreading" required>
                    <label for="project1">Project 1: E-Book Content Editing & Proofreading</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="project2" name="Selected_Project" value="Project 2: Digital Manuscript Typing & Formatting">
                    <label for="project2">Project 2: Digital Manuscript Typing & Formatting</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="project3" name="Selected_Project" value="Project 3: Online Book Promotion & Data Management">
                    <label for="project3">Project 3: Online Book Promotion & Data Management</label>
                </div>
            </div>
        </div>

        <!-- Payment UTR Option -->
        <div class="form-group">
            <label for="utr">Payment UTR / Transaction ID (भुगतान विवरण):</label>
            <input type="text" id="utr" name="Payment_UTR_Number" required placeholder="Apna UTR ya Transaction Number yahan daalein">
            <div class="note">Kripya payment karne ke baad uska UTR number yahan enter karein.</div>
        </div>

        <div class="form-group">
            <label for="payment_proof">Payment Screenshot / Receipt (वैकल्पिक / Optional):</label>
            <input type="file" id="payment_proof" name="Payment_Screenshot" accept="image/*,.pdf">
        </div>

        <!-- Blinking / Pop-up Submit Button -->
        <button type="submit" class="submit-btn">Submit Application</button>

    </form>
</div>

</body>
              </html>
